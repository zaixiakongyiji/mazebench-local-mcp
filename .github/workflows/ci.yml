name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keep the merge gate deterministic: generated validators and packaged
  # runtime must be rebuilt and proven drift-free before behavioral tests.
  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build standalone validators
        run: npm run build:validators

      - name: Sync runtime assets
        run: npm run sync-runtime

      - name: Verify zero tracked and untracked runtime drift
        run: |
          git diff --exit-code -- shared/validators.standalone.js environments/mazebench/mazebench/runtime
          test -z "$(git status --porcelain -- shared/validators.standalone.js environments/mazebench/mazebench/runtime)"

      - name: Python CLI tests
        run: python -m unittest tests/test_mazebench_cli.py

      - name: Core PR smoke suite
        run: npm run test:pr

  game-isolation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: environments/mazebench/uv.lock

      - name: Verify isolated game runtime
        run: uv run --locked --project environments/mazebench python3 -m unittest tests/test_game_runtime_isolation.py

  test-browser:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright tests
        run: npx playwright-core install --with-deps chromium

      - name: Browser E2E test suite
        run: npm run test:browser

  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: environments/mazebench/uv.lock

      - run: npm ci

      - name: Python CLI tests
        run: python -m unittest tests/test_mazebench_cli.py

      - name: Node test suite
        run: npm test

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Build standalone validators
        run: npm run build:validators

      - name: Sync runtime assets
        run: npm run sync-runtime

      - name: Verify zero tracked and untracked runtime drift
        run: |
          git diff --exit-code -- shared/validators.standalone.js environments/mazebench/mazebench/runtime
          test -z "$(git status --porcelain -- shared/validators.standalone.js environments/mazebench/mazebench/runtime)"

      - name: Stage the Python runtime
        run: node scripts/build-python-runtime.js

      - name: Build wheel + sdist
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Verify wheel + sdist contents
        run: python scripts/verify-python-distributions.py dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Prove the supported Python range on every full run: the oldest we claim
  # (requires-python >= 3.9) and the newest stable release across Ubuntu and Windows.
  wheel-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Verify wheel smoke, MCP stdio handshake, and isolated validator
        run: python scripts/verify-wheel-smoke.py dist
